<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- DSLab tab icon: a three-node tree on an indigo-to-cyan gradient. Browsers
       that animate SVG icons (Firefox) show the nodes lighting up in turn, like a
       traversal; the app also animates the icon itself while an operation plays
       (web/src/ui/useFavicon.ts). -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <style>
      circle { fill: #fff; transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
      .b { animation-delay: .8s; }
      .c { animation-delay: 1.6s; }
      @keyframes pulse { 0%, 60%, 100% { transform: scale(1); opacity: .8; } 25% { transform: scale(1.25); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { circle { animation: none; opacity: 1; } }
    </style>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#g)"/>
  <path d="M16 9 9.5 22.5M16 9l6.5 13.5" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="16" cy="9" r="4.5"/>
  <circle class="b" cx="9.5" cy="22.5" r="4.5"/>
  <circle class="c" cx="22.5" cy="22.5" r="4.5"/>
</svg>
